name: Service container

on:
  pull_request:
    paths: ["sdk-python/**", "deploy/**", "console/**", "sdk-js/packages/core/**", "spec/assets/**", "Dockerfile", ".dockerignore", ".github/workflows/publish-docker.yml"]
  push:
    branches: [main]
    paths: ["sdk-python/**", "deploy/**", "console/**", "sdk-js/packages/core/**", "spec/assets/**", "Dockerfile", ".dockerignore", ".github/workflows/publish-docker.yml"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'service-v')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: oe, POSTGRES_USER: oe, POSTGRES_DB: oe }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source and version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node -e 'const p = require("./console/package.json"); if (process.env.RELEASE_TAG !== `service-v${p.version}`) process.exit(1)'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --prefix sdk-js && npm ci --prefix console
      - run: npx --prefix console playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: openentitlement:test
      - name: Test published Python runtime, console and authentication boundary
        run: |
          docker run -d --name oe-test --network host -e DATABASE_URL=postgresql://oe:oe@127.0.0.1:5432/oe openentitlement:test
          trap 'docker logs oe-test; docker rm -f oe-test' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused --retry-all-errors http://127.0.0.1:8787/healthz
          curl --fail http://127.0.0.1:8787/ | grep -qi '<!doctype html'
          test "$(curl -s -o /tmp/problem.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"context":{"organizationId":"acme"}}' http://127.0.0.1:8787/oerep/v1/products/acme/privileges/seats/resolve)" = 401
          docker exec oe-test python -c "import openentitlement_service, openentitlement; print('Python runtime and SDK installed')"
      - name: Black-box Product parity and SDK evaluation against the published image
        env:
          OE_PG_DSN: postgresql://oe:oe@127.0.0.1:5432/oe
          OE_TEST_IMAGE: openentitlement:test
        run: npm run test:python-service --prefix console

  publish:
    if: github.event_name == 'push' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'service-v'))
    needs: test
    runs-on: ubuntu-latest
    environment: dockerhub
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: olivierbelhumeur/openentitlement
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'push' }}
            type=sha
            type=match,pattern=service-v(.*),group=1,enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
      - uses: docker/login-action@v4
        with:
          username: olivierbelhumeur
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
