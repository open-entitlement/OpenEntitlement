# Persistent Python service; migrations run at startup. URL-encode the database password.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: oe
      POSTGRES_DB: oe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - oe-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oe -d oe"]
      interval: 5s
      timeout: 5s
      retries: 10

  openentitlement:
    image: olivierbelhumeur/openentitlement:${OE_VERSION:-edge}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      DATABASE_URL: postgresql://oe:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/oe
      OE_APP_URL: ${OE_APP_URL:-http://localhost:8787}
      # HTTP is accepted only for loopback origins; use false with TLS deployments.
      OE_OIDC_LOCAL_HTTP: ${OE_OIDC_LOCAL_HTTP:-true}
      OE_OIDC_ISSUER: ${OE_OIDC_ISSUER:?set OE_OIDC_ISSUER}
      OE_OIDC_CLIENT_ID: ${OE_OIDC_CLIENT_ID:-openentitlement}
      OE_PLATFORM_ADMIN_SUBJECT: ${OE_PLATFORM_ADMIN_SUBJECT:?set OE_PLATFORM_ADMIN_SUBJECT}

volumes:
  oe-postgres:
